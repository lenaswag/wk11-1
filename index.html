<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>그림으로 말하는 영어 | 현재진행형</title><style>
:root{--navy:#24364d;--blue:#2869b2;--pale:#eaf3ff;--cream:#fffaf2;--line:#dce5ef;--muted:#617188;--orange:#e8a26d;--green:#187a63}*{box-sizing:border-box}body{margin:0;background:#f3f6fa;color:var(--navy);font:16px/1.65 'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif}button,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}.wrap{max-width:1080px;margin:auto;padding:20px}.head{background:#fff;border:1px solid var(--line);border-radius:20px;padding:20px 25px;display:flex;justify-content:space-between;gap:12px;align-items:center}.brand{font-size:24px;font-weight:900}.brand em{font-style:normal;color:var(--blue)}.small{color:var(--muted);font-size:14px}.pill{background:#fff0db;border-radius:25px;padding:8px 14px;font-size:14px;font-weight:800}.steps{display:flex;gap:7px;margin:18px 0}.step{height:9px;flex:1;background:#dfe7f0;border-radius:8px}.step.on{background:var(--blue)}.step.past{background:#9cc7ef}.paper{background:white;border:1px solid var(--line);border-radius:22px;padding:30px;min-height:560px;box-shadow:0 8px 25px #273b5510}.kicker{font-size:13px;letter-spacing:.5px;color:var(--blue);font-weight:900}h1{font-size:31px;line-height:1.3;margin:8px 0 12px}h2{font-size:25px;line-height:1.35;margin:7px 0 12px}h3{font-size:19px;margin:8px 0}.desc{color:var(--muted);margin:0 0 22px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:22px}.three{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.box{background:var(--cream);border:1px solid #eee6da;border-radius:16px;padding:18px}.blue{background:var(--pale);border:1px solid #d6e6fa;border-radius:16px;padding:18px}.btn{border:0;background:var(--blue);color:white;border-radius:12px;padding:11px 18px;font-weight:800;min-height:45px}.btn.secondary{background:#eaf2fc;color:#245c9c}.btn.line{background:white;color:var(--navy);border:2px solid var(--line)}.btn.active{outline:2px solid var(--blue);background:#dcecff;color:#174d8b}.btn:hover:not(:disabled){filter:brightness(.96)}.nav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:25px;flex-wrap:wrap}.choice{display:block;width:100%;text-align:left;background:white;border:2px solid var(--line);padding:13px 15px;border-radius:12px;margin:9px 0;color:var(--navy);font-weight:700}.choice:hover:not(:disabled){border-color:#8ab5e4;background:#f8fbff}.choice.good{background:#e8f6ef;border-color:#78bba6}.choice.bad{background:#fff1e9;border-color:#e5a18c}.feedback{margin-top:14px;background:#fff2dc;border:1px solid #f1d49b;padding:13px 16px;border-radius:12px;font-weight:700}.feedback.ok{background:#e9f7ef;border-color:#9fd5bd;color:#14654e}.picture{border:1px solid var(--line);background:#eaf4ff;border-radius:15px;overflow:hidden}.picture svg{width:100%;height:auto;display:block}.sentence{font-size:19px;background:#fff;border:1px solid var(--line);padding:13px 15px;border-radius:11px;margin:9px 0}.question{font-size:19px;font-weight:900;margin:15px 0}.words{display:flex;gap:9px;flex-wrap:wrap;margin:15px 0}.word{border:2px solid var(--line);background:#fff;border-radius:10px;padding:9px 13px;font-weight:800}.answer{min-height:67px;background:#f2f7ff;border:2px dashed #a5c3e7;border-radius:12px;padding:11px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}textarea{width:100%;min-height:108px;resize:vertical;border:2px solid var(--line);border-radius:12px;padding:14px;color:var(--navy);outline:none}textarea:focus{border-color:var(--blue)}.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.hint{margin-top:12px;background:#fff5d9;padding:13px;border-radius:12px}.center{text-align:center}.badge{display:inline-block;background:#fff0df;color:#985d31;border-radius:30px;padding:4px 12px;font-size:13px;font-weight:800}.dot{display:inline-block;width:13px;height:13px;border-radius:50%;background:#d9e4ef;margin-right:6px}.dot.done{background:#39a389}.result{padding:12px 15px;background:#f5f8fc;border-radius:10px;margin:8px 0;overflow-wrap:anywhere}.subject{color:#2462a7;font-weight:900}.verb{color:#a95a30;font-weight:900}.ing{color:#187a63;font-weight:900}.hidden{display:none}.footer{font-size:13px;color:var(--muted);margin-top:16px;text-align:center}@media(max-width:720px){.wrap{padding:10px}.paper{padding:18px}.head{padding:14px}.brand{font-size:19px}.grid,.three{grid-template-columns:1fr}h1{font-size:25px}h2{font-size:22px}.pill{font-size:12px}.sentence{font-size:17px}}
</style></head><body><div class="wrap"><header class="head"><div><div class="brand">📘 <em>그림으로 말하는 영어</em></div><div class="small">초등 6학년 · 현재진행형 · 개별 학습</div></div><span class="pill">⏱ 15~20분</span></header><div class="steps" id="steps"></div><main class="paper" id="app" aria-live="polite"></main><div class="footer">영어 문장을 직접 발견하고 완성하는 디지털 학습 활동</div></div><script>
'use strict';
const $=id=>document.getElementById(id), app=$('app');
let stage=0,index=0,tries=0,locked=false,feedback='',ok=false,selected=[],mission=0,mode='write',hint=0,answers=[[],[]],rec=null,recording=false;
const match=[{scene:'bike',options:['He is riding a bike.','He is reading a book.','He is eating lunch.'],correct:0},{scene:'read',options:['She is swimming.','She is reading a book.','She is playing soccer.'],correct:1},{scene:'soccer',options:['They are dancing.','They are cooking.','They are playing soccer.'],correct:2}];
const listen=[{text:'She is drawing a picture.',pics:['draw','bike','read'],correct:0},{text:'They are playing soccer.',pics:['read','soccer','cook'],correct:1},{text:'He is cooking dinner.',pics:['cook','draw','bike'],correct:0}];
const detect=[{lines:['He is running.','She is reading.','They are playing.'],q:'이 문장들은 어떤 상황을 설명하나요?',options:['지금 하고 있는 행동','어제 했던 행동','내일 할 행동'],correct:0,tip:'사람들이 바로 지금 무엇을 하고 있는지 생각해 보세요.'},{lines:['He is running.','I am drawing.','They are playing.'],q:'-ing로 끝나는 동사 앞에는 어떤 말이 있나요?',options:['a / an','am / is / are','do / does'],correct:1,tip:'각 문장에서 동작을 나타내는 말 바로 앞을 살펴보세요.'},{lines:['I am eating.','She is eating.','They are eating.'],q:'주어가 달라지면 무엇이 바뀌나요?',options:['eating이 바뀐다','be동사가 바뀐다','모든 단어가 바뀐다'],correct:1,tip:'I, She, They 뒤의 단어를 비교해 보세요.'}];
const discover=[{q:'I와 함께 쓰는 be동사는?',options:['am','is','are'],correct:0},{q:'She와 함께 쓰는 be동사는?',options:['am','is','are'],correct:1},{q:'They와 함께 쓰는 be동사는?',options:['am','is','are'],correct:2},{q:'지금 하고 있는 행동을 나타내는 문장은?',options:['He plays soccer every Sunday.','He is playing soccer now.','He played soccer yesterday.'],correct:1}];
const build=[{scene:'read',words:['a book.','reading','is','She'],answer:['She','is','reading','a book.']},{scene:'soccer',words:['soccer.','playing','are','They'],answer:['They','are','playing','soccer.']},{scene:'draw',words:['drawing','I','am','a picture.'],answer:['I','am','drawing','a picture.']}];
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function person(x,y,color){return `<circle cx="${x}" cy="${y-49}" r="15" fill="#f2c49e"/><path d="M${x-15} ${y-52}Q${x-6} ${y-73} ${x+12} ${y-58}" fill="none" stroke="#5c493d" stroke-width="9" stroke-linecap="round"/><rect x="${x-17}" y="${y-31}" width="34" height="39" rx="10" fill="${color}"/><path d="M${x-10} ${y+7}l-9 35 M${x+10} ${y+7}l9 35" stroke="#516c92" stroke-width="10" stroke-linecap="round"/><path d="M${x-15} ${y-20}l-13 24 M${x+15} ${y-20}l13 24" stroke="#f2c49e" stroke-width="9" stroke-linecap="round"/>`;}
function illustration(type){let art='';if(type==='bike')art=`<circle cx="100" cy="170" r="34" fill="none" stroke="#58758f" stroke-width="6"/><circle cx="220" cy="170" r="34" fill="none" stroke="#58758f" stroke-width="6"/><path d="M100 170L145 112L177 170H100M145 112L220 170H177" fill="none" stroke="#e4a065" stroke-width="6"/>${person(154,100,'#e5a65c')}`;if(type==='read')art=`${person(165,113,'#e8a0a2')}<rect x="119" y="100" width="94" height="57" rx="4" fill="#668fcb"/><path d="M166 101v55" stroke="white" stroke-width="3"/>`;if(type==='soccer')art=`${person(107,112,'#e6b46b')}${person(235,112,'#91b8d7')}<circle cx="175" cy="178" r="20" fill="white" stroke="#54687b" stroke-width="3"/><path d="M175 162l11 9-4 12h-14l-5-12z" fill="#54687b"/>`;if(type==='draw')art=`${person(158,105,'#e7a4a3')}<rect x="95" y="136" width="145" height="53" rx="6" fill="#e6c39b"/><rect x="113" y="118" width="105" height="56" fill="white"/><circle cx="163" cy="142" r="13" fill="#f6c96c"/><path d="M130 161q34-35 64 0" stroke="#8bbb9c" stroke-width="5" fill="none"/>`;if(type==='cook')art=`${person(162,104,'#92c0ad')}<rect x="85" y="135" width="165" height="60" rx="7" fill="#e1bd9c"/><ellipse cx="165" cy="137" rx="50" ry="15" fill="#607b90"/><path d="M145 115q-10-15 0-27M175 114q-10-15 0-27" stroke="#b3c8d2" stroke-width="4" fill="none"/>`;return `<div class="picture"><svg viewBox="0 0 340 220" role="img" aria-label="영어 학습용 행동 그림"><rect width="340" height="220" fill="#eaf5ff"/><circle cx="280" cy="43" r="22" fill="#ffe2a2"/><path d="M0 184Q90 162 175 185T340 183V220H0Z" fill="#cde8d5"/><path d="M28 177V89" stroke="#aa8969" stroke-width="12"/><circle cx="30" cy="75" r="38" fill="#a8d9bd"/>${art}</svg></div>`;}
function largeScene(n){const basic=n===0;let art='';const people=basic?[[85,163,'#e5b16d'],[230,163,'#90b9d8'],[385,163,'#e9a3a3']]:[[105,163,'#e5b16d'],[255,163,'#90b9d8'],[395,163,'#e9a3a3']];people.forEach(p=>art+=person(...p));if(basic){art+=`<rect x="60" y="139" width="49" height="28" rx="3" fill="#648dca"/><path d="M85 139v28" stroke="white" stroke-width="3"/><circle cx="274" cy="196" r="18" fill="white" stroke="#52677b" stroke-width="3"/><path d="M274 181l11 9-4 12h-14l-5-12z" fill="#52677b"/><circle cx="359" cy="199" r="22" fill="none" stroke="#56758f" stroke-width="5"/><circle cx="426" cy="199" r="22" fill="none" stroke="#56758f" stroke-width="5"/><path d="M359 199l30-37 37 37h-67l30-37" stroke="#e7a06c" stroke-width="5" fill="none"/>`;}else{art+=`<path d="M78 151Q180 70 282 151" stroke="#e6a065" stroke-width="5" fill="none"/><rect x="402" y="161" width="57" height="49" fill="white" stroke="#9bb5cf" stroke-width="4"/><circle cx="428" cy="178" r="9" fill="#f2ca6c"/><path d="M413 199l14-14 17 14" fill="none" stroke="#8bb99e" stroke-width="4"/>`;}return `<div class="picture"><svg viewBox="0 0 480 265" role="img" aria-label="${basic?'책 읽기, 축구하기, 자전거 타기':'줄넘기와 그림 그리기'}"><rect width="480" height="265" fill="#eaf5ff"/><circle cx="423" cy="43" r="26" fill="#ffe0a0"/><path d="M0 207Q120 181 240 206T480 207V265H0Z" fill="#cce8d6"/><rect x="27" y="100" width="15" height="109" fill="#a98868"/><circle cx="36" cy="80" r="47" fill="#a8d9bd"/>${art}</svg></div>`;}
function header(n,title,description){return `<div class="kicker">활동 ${n} / 6</div><h2>${title}</h2><p class="desc">${description}</p>`;}
function feedbackUI(){return feedback?`<div class="feedback ${ok?'ok':''}" role="status">${esc(feedback)}</div>`:'';}
function nav(back=true){return `<div class="nav">${back?'<button class="btn line" onclick="back()">← 이전</button>':'<span></span>'}<span class="small">차근차근 관찰하고 생각해 보세요.</span></div>`;}
function progress(){ $('steps').innerHTML=Array.from({length:6},(_,i)=>`<div class="step ${i+1<stage?'past':i+1===stage?'on':''}" title="활동 ${i+1}"></div>`).join('');}
function stopMic(){if(rec){try{rec.abort()}catch(e){}rec=null;}recording=false;}
function move(n){stopMic();stage=n;index=0;tries=0;locked=false;feedback='';ok=false;selected=[];hint=0;window.scrollTo(0,0);render();}
function render(){progress();if(stage===0)welcome();if(stage===1)showMatch();if(stage===2)showListen();if(stage===3)showDetect();if(stage===4)showDiscover();if(stage===5)showBuild();if(stage===6)showMission();if(stage===7)finish();}
function welcome(){app.innerHTML=`<div class="center"><div style="font-size:46px">🔎 📖</div><div class="kicker">TODAY'S ENGLISH MISSION</div><h1>그림 속 행동을 영어로 설명해요!</h1><p class="desc">그림을 관찰하고, 문장 속 규칙을 발견한 다음 직접 영어 문장을 만들어 봅시다.</p><div style="max-width:630px;margin:20px auto">${largeScene(0)}</div><div class="blue" style="max-width:680px;margin:auto"><strong>오늘의 학습 목표</strong><br>현재진행형을 사용하여 그림 속 인물이 지금 하고 있는 행동을 영어로 설명할 수 있다.</div><p class="small" style="margin-top:18px">그림 관찰 → 듣기 → 규칙 찾기 → 문장 만들기 → 말하기·쓰기</p><button class="btn" onclick="move(1)">학습 시작하기 →</button></div>`;}
function choices(options,fn){return options.map((v,i)=>`<button class="choice" ${locked?'disabled':''} onclick="${fn}(${i})">${esc(v)}</button>`).join('');}
function showMatch(){const a=match[index];app.innerHTML=header(1,'그림과 문장 연결하기','그림을 자세히 보고, 인물의 행동을 가장 잘 설명한 영어 문장을 선택하세요.')+`<div class="grid"><div>${illustration(a.scene)}<p class="small">문제 ${index+1} / ${match.length}</p></div><div><div class="question">그림 속 인물은 무엇을 하고 있나요?</div>${choices(a.options,'checkMatch')}${feedbackUI()}</div></div>${nav()}`;}
function advance(fn){const b=document.createElement('button');b.className='btn';b.textContent='다음 문제 →';b.onclick=fn;const navEl=app.querySelector('.nav');navEl.appendChild(b);}
function checkMatch(i){if(locked)return;const a=match[index];if(i===a.correct){locked=true;ok=true;feedback='잘했어요! 그림 속 행동과 문장을 정확히 연결했어요.';showMatch();advance(()=>{if(++index===match.length)move(2);else resetItem();});}else{tries++;ok=false;feedback=tries===1?'인물이 어떤 행동을 하고 있는지 다시 살펴보세요.':'그림 속 동작과 영어 동사를 비교해 보세요.';showMatch();}}
function resetItem(){tries=0;locked=false;feedback='';ok=false;selected=[];render();}
function tts(s){if(!('speechSynthesis'in window)){alert('이 브라우저에서는 음성 재생을 지원하지 않습니다.');return;}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(s);u.lang='en-US';u.rate=.85;speechSynthesis.speak(u);}
function showListen(){const a=listen[index];app.innerHTML=header(2,'듣고 알맞은 그림 고르기','영어 문장을 듣고, 그 문장이 설명하는 그림을 선택하세요. 여러 번 들어도 좋아요.')+`<div class="blue center"><button class="btn" onclick="tts(${JSON.stringify(a.text).replace(/"/g,'&quot;')})">🔊 영어 문장 듣기</button><div class="small" style="margin-top:7px">소리가 잘 들리지 않으면 다시 눌러 보세요.</div></div><div class="three" style="margin-top:20px">${a.pics.map((p,i)=>`<button class="choice" style="margin:0" ${locked?'disabled':''} onclick="checkListen(${i})">${illustration(p)}<div class="center">그림 ${i+1}</div></button>`).join('')}</div>${feedbackUI()}<div class="nav"><button class="btn line" onclick="back()">← 이전</button><span class="small">문제 ${index+1} / ${listen.length}</span></div>`;}
function checkListen(i){if(locked)return;if(i===listen[index].correct){locked=true;ok=true;feedback='정확하게 들었어요! 문장과 그림이 일치해요.';showListen();advance(()=>{if(++index===listen.length)move(3);else resetItem();});}else{tries++;ok=false;feedback='영어 문장을 다시 듣고 어떤 행동을 말하는지 찾아보세요.';showListen();}}
function showDetect(){const a=detect[index];app.innerHTML=header(3,'문법 탐정: 공통점 찾기','문장들을 비교해 보세요. 아직 규칙을 외우지 않아도 괜찮아요.')+`<div class="blue">${a.lines.map(v=>`<div class="sentence">${esc(v)}</div>`).join('')}</div><div class="question">${a.q}</div>${choices(a.options,'checkDetect')}${feedbackUI()}<div class="nav"><button class="btn line" onclick="back()">← 이전</button><span class="small">문제 ${index+1} / ${detect.length}</span></div>`;}
function checkDetect(i){if(locked)return;const a=detect[index];if(i===a.correct){locked=true;ok=true;feedback='좋아요! 중요한 문장 규칙을 발견했어요.';showDetect();advance(()=>{if(++index===detect.length)move(4);else resetItem();});}else{tries++;ok=false;feedback=a.tip;showDetect();}}
function showDiscover(){if(index===discover.length){rulePage();return;}const a=discover[index];app.innerHTML=header(4,'규칙 발견하고 확인하기','앞에서 관찰한 문장을 떠올리며, 스스로 발견한 규칙을 적용해 보세요.')+`<div class="question">${a.q}</div>${choices(a.options,'checkDiscover')}${feedbackUI()}<div class="nav"><button class="btn line" onclick="back()">← 이전</button><span class="small">문제 ${index+1} / ${discover.length}</span></div>`;}
function checkDiscover(i){if(locked)return;if(i===discover[index].correct){locked=true;ok=true;feedback='맞았어요! 발견한 규칙을 잘 적용했어요.';showDiscover();advance(()=>{index++;resetItem();});}else{tries++;ok=false;feedback='앞에서 본 예문을 다시 떠올려 보세요. 주어 뒤에는 어떤 be동사가 왔나요?';showDiscover();}}
function rulePage(){app.innerHTML=header(4,'현재진행형 규칙 정리','여러분이 발견한 규칙을 한눈에 정리해 봅시다.')+`<div class="blue center"><h2><span class="subject">주어</span> + <span class="verb">am / is / are</span> + <span class="ing">동사-ing</span></h2><div>지금 하고 있는 행동을 나타낼 때 사용해요.</div></div><div class="three" style="margin-top:15px"><div class="box center"><strong>I</strong><br><span class="verb">am</span></div><div class="box center"><strong>He / She / It</strong><br><span class="verb">is</span></div><div class="box center"><strong>You / We / They</strong><br><span class="verb">are</span></div></div><div class="sentence"><span class="subject">She</span> <span class="verb">is</span> <span class="ing">reading</span> a book.</div><div class="sentence"><span class="subject">They</span> <span class="verb">are</span> <span class="ing">playing</span> soccer.</div><div class="box"><strong>동사에 -ing 붙이기</strong><br>play → playing / make → making / run → running</div><div class="nav"><button class="btn line" onclick="back()">← 이전</button><button class="btn" onclick="move(5)">문장 만들기 연습 →</button></div>`;}
function showBuild(){const a=build[index];app.innerHTML=header(5,'문장 조립하기','그림을 보고 단어 카드를 올바른 순서로 눌러 현재진행형 문장을 완성하세요.')+`<div class="grid"><div>${illustration(a.scene)}</div><div><div class="question">단어를 순서대로 선택하세요.</div><div class="answer">${selected.length?selected.map((v,i)=>`<button class="word" ${locked?'disabled':''} onclick="removeWord(${i})">${esc(v.text)}</button>`).join(''):'<span class="small">아래 단어를 눌러 문장을 완성하세요.</span>'}</div><div class="words">${a.words.map((v,i)=>`<button class="word" ${locked||selected.some(x=>x.i===i)?'disabled':''} onclick="addWord(${i})">${esc(v)}</button>`).join('')}</div><div class="row"><button class="btn secondary" ${locked?'disabled':''} onclick="selected=[];feedback='';render()">다시 배열하기</button><button class="btn" ${locked?'disabled':''} onclick="checkBuild()">문장 확인</button></div>${feedbackUI()}</div></div><div class="nav"><button class="btn line" onclick="back()">← 이전</button><span class="small">문제 ${index+1} / ${build.length}</span></div>`;if(locked)advance(()=>{if(++index===build.length)move(6);else resetItem();});}
function addWord(i){selected.push({i,text:build[index].words[i]});feedback='';render();}function removeWord(i){selected.splice(i,1);feedback='';render();}
function checkBuild(){const a=build[index];if(selected.map(x=>x.text).join(' ')===a.answer.join(' ')){locked=true;ok=true;feedback='정확해요! 주어, be동사, 동사-ing 순서로 문장을 만들었어요.';}else{tries++;ok=false;feedback=selected.length!==a.words.length?'모든 단어를 사용했는지 확인하세요.':tries===1?'누가 행동하나요? 주어를 먼저 놓아 보세요.':'주어 → am/is/are → 동사-ing 순서로 다시 생각해 보세요.';}render();}
const missions=[{name:'기본 미션',title:'그림을 보고 두 문장 만들기',vocab:'read a book / play soccer / ride a bike',starter:'The girl is ______. / The boy is ______.',targets:[{subjects:['girl','she'],verbs:['reading'],label:'reading'},{subjects:['boy','he'],verbs:['playing'],label:'playing'},{subjects:['girl','she'],verbs:['riding'],label:'riding'}]},{name:'도전 미션',title:'새로운 그림을 보고 두 문장 만들기',vocab:'jump rope / paint a picture / draw a picture',starter:'The children are ______. / The girl is ______.',targets:[{subjects:['children','they','kids','boys'],verbs:['jumping'],label:'jumping'},{subjects:['girl','she'],verbs:['painting','drawing'],label:'painting'}]}];
function showMission(){const m=missions[mission],done=answers[mission].length;app.innerHTML=header(6,'그림을 영어로 설명하기',mission===0?'기본 미션: 그림 속 행동을 현재진행형 문장 2개로 설명하세요.':'도전 미션: 새로운 그림을 보고 현재진행형 문장 2개를 만들어 보세요.')+`<div class="row" style="margin-bottom:14px"><span class="badge">${m.name}</span><strong>${done} / 2문장 완성</strong><span>${[0,1].map(i=>`<span class="dot ${i<done?'done':''}"></span>`).join('')}</span></div><div class="grid"><div>${largeScene(mission)}<p class="small">그림 속 인물이 지금 하고 있는 행동을 설명해 보세요.</p>${answers[mission].map((v,i)=>`<div class="result"><strong>${i+1}.</strong> ${esc(v.text)}</div>`).join('')}</div><div><h3>${m.title}</h3><div class="row" style="margin:12px 0"><button class="btn ${mode==='write'?'':'secondary'}" onclick="switchMode('write')">✏️ 글로 쓰기</button><button class="btn ${mode==='speak'?'':'secondary'}" onclick="switchMode('speak')">🎤 말로 하기</button></div>${mode==='speak'?`<div class="blue center" style="margin-bottom:12px"><button class="btn" id="mic" onclick="toggleMic()">🎤 녹음 시작</button><div class="small" id="micstatus">마이크를 누르고 영어 문장 한 개를 말하세요.</div></div>`:''}<label for="response"><strong>${mode==='write'?'영어 문장을 입력하세요.':'인식된 영어 문장을 확인하세요.'}</strong></label><textarea id="response" placeholder="예: The girl is reading a book."></textarea>${mode==='speak'?'<p class="small">음성 인식이 잘못되었다면 제출하기 전에 글자를 수정하세요.</p>':''}<div class="row" style="margin-top:10px"><button class="btn line" onclick="hintShow(1)">💡 단어 힌트</button><button class="btn line" onclick="hintShow(2)">🧩 문법 힌트</button><button class="btn line" onclick="hintShow(3)">✏️ 문장 틀</button></div><div id="hintArea"></div><button class="btn" style="width:100%;margin-top:14px" onclick="checkMission()">내 문장 확인하기</button><div id="missionFeedback">${feedbackUI()}</div></div></div><div class="nav"><button class="btn line" onclick="back()">← 이전</button>${mission===1?'<button class="btn secondary" onclick="move(7)">학습 마치기 →</button>':''}</div>`;if(hint)hintShow(hint);}
function hintShow(n){hint=n;const m=missions[mission];$('hintArea').innerHTML=`<div class="hint">${n===1?'<strong>단어 힌트</strong><br>'+m.vocab:n===2?'<strong>문법 힌트</strong><br>주어 + am/is/are + 동사-ing<br>I am / She is / They are':'<strong>문장 틀</strong><br>'+m.starter}</div>`;}
function switchMode(m){const value=$('response')?.value||'';stopMic();mode=m;showMission();$('response').value=value;}
function toggleMic(){if(recording){stopMic();if($('micstatus'))$('micstatus').textContent='녹음을 중지했어요.';return;}const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){alert('이 브라우저는 음성 인식을 지원하지 않습니다. Chrome 또는 Edge에서 시도하거나 글로 쓰기를 선택하세요.');return;}const r=new SR();rec=r;r.lang='en-US';r.interimResults=false;r.continuous=false;r.onstart=()=>{recording=true;if($('mic'))$('mic').textContent='⏹ 녹음 중지';if($('micstatus'))$('micstatus').textContent='영어로 한 문장을 말해 보세요.';};r.onresult=e=>{if($('response'))$('response').value=e.results[0][0].transcript;if($('micstatus'))$('micstatus').textContent='인식된 문장을 확인한 후 제출하세요.';};r.onerror=e=>{if($('micstatus'))$('micstatus').textContent='마이크 오류: '+e.error+'. 글로 입력해도 좋아요.';};r.onend=()=>{recording=false;rec=null;if($('mic'))$('mic').textContent='🎤 녹음 시작';};try{r.start();}catch(e){alert('마이크를 시작하지 못했습니다.');}}
function analyze(raw){const s=raw.toLowerCase().replace(/[.,!?]/g,' ').replace(/\s+/g,' ').trim();if(!s)return {good:false,msg:'그림을 보고 영어 문장을 한 개 만들어 보세요.'};const tokens=s.split(' '),bi=tokens.findIndex(w=>['am','is','are'].includes(w));if(bi<0)return {good:false,msg:'지금 하고 있는 행동을 나타낼 때 필요한 be동사가 빠지지 않았나요?'};if(bi===0)return {good:false,msg:'누가 행동하고 있나요? 문장의 맨 앞에 주어를 넣어 보세요.'};const subject=tokens.slice(0,bi).join(' '),be=tokens[bi],rest=tokens.slice(bi+1);let expected=null;if(subject==='i')expected='am';else if(/\b(they|we|you|children|boys|girls|kids|people)\b/.test(subject))expected='are';else if(/\b(he|she|it|boy|girl|child|student)\b/.test(subject))expected='is';if(expected&&be!==expected)return {good:false,msg:'주어와 be동사가 어울리는지 확인해 보세요. am, is, are 중 무엇이 맞을까요?'};if(!rest.some(w=>w.endsWith('ing')))return {good:false,msg:'행동을 나타내는 동사의 형태를 확인하세요. -ing가 필요하지 않을까요?'};const targets=missions[mission].targets;const matched=targets.filter(t=>t.subjects.some(x=>new RegExp('\\b'+x+'\\b').test(subject))&&t.verbs.some(v=>rest.includes(v)));if(!matched.length)return {good:false,msg:'그림 속 인물과 행동이 문장에 맞게 나타났나요? 그림을 다시 관찰해 보세요.'};if(answers[mission].some(a=>a.text.toLowerCase().replace(/[.!?]/g,'').trim()===s))return {good:false,msg:'이미 만든 문장이에요. 그림 속 다른 행동을 찾아보세요.'};return {good:true,msg:'잘했어요! 현재진행형으로 그림 속 행동을 설명했어요.',action:matched[0].label};}
function checkMission(){const value=$('response').value.trim();const result=analyze(value);if(!result.good){tries++;feedback=result.msg+(tries>=2?' 필요하다면 힌트 버튼을 눌러 도움을 받아 보세요.':'');ok=false;$('missionFeedback').innerHTML=feedbackUI();return;}if(answers[mission].some(a=>a.action===result.action)){feedback='이번에는 다른 행동을 설명해 보세요. 같은 행동을 반복하지 않는 것이 목표예요.';ok=false;$('missionFeedback').innerHTML=feedbackUI();return;}answers[mission].push({text:value,action:result.action});feedback='';tries=0;hint=0;stopMic();if(answers[mission].length===2){mission===0?basicComplete():challengeComplete();}else{showMission();$('missionFeedback').innerHTML='<div class="feedback ok">좋아요! 이제 그림 속 다른 행동을 한 문장 더 설명해 보세요.</div>';}}
function basicComplete(){app.innerHTML=`<div class="center"><div style="font-size:54px">🌟</div><h1>기본 미션 완료!</h1><p>현재진행형을 사용하여 영어 문장 2개를 만들었어요.</p><div class="blue" style="max-width:650px;margin:20px auto;text-align:left">${answers[0].map((a,i)=>`<div class="result">${i+1}. ${esc(a.text)}</div>`).join('')}</div><h3>새로운 그림에도 도전해 볼까요?</h3><p class="desc">선택 활동에서는 새로운 그림을 보고 영어 문장 2개를 더 만듭니다.</p><div class="row" style="justify-content:center"><button class="btn secondary" onclick="move(7)">여기서 마치기</button><button class="btn" onclick="mission=1;mode='write';move(6)">도전 미션 시작 →</button></div></div>`;}
function challengeComplete(){app.innerHTML=`<div class="center"><div style="font-size:54px">🏆</div><h1>도전 미션 완료!</h1><p>새로운 그림에서도 현재진행형 문장 2개를 만들었어요!</p><div class="blue" style="max-width:650px;margin:20px auto;text-align:left">${answers[1].map((a,i)=>`<div class="result">${i+1}. ${esc(a.text)}</div>`).join('')}</div><button class="btn" onclick="move(7)">학습 결과 확인 →</button></div>`;}
function finish(){const count=answers.flat().length;app.innerHTML=`<div class="center"><div style="font-size:56px">🎉</div><h1>오늘의 학습 완료!</h1><p>그림 속 행동을 현재진행형으로 표현하는 방법을 배웠어요.</p><div class="blue" style="max-width:550px;margin:20px auto"><strong>완성한 영어 문장: ${count}개</strong><br>현재진행형: 주어 + am/is/are + 동사-ing</div></div><h3>내가 만든 문장</h3>${answers.map((group,i)=>group.length?`<div class="box" style="margin:12px 0"><strong>${i===0?'기본 미션':'도전 미션'}</strong>${group.map((a,j)=>`<div class="result">${j+1}. ${esc(a.text)}</div>`).join('')}</div>`:'').join('')}<p class="small">이 앱은 학습용 연습 도구입니다. 자유 문장 피드백은 제한적인 규칙 검사이므로 모든 올바른 표현을 판별하지는 못합니다. 답변은 서버에 저장되지 않습니다.</p><div class="nav"><button class="btn line" onclick="restart()">처음부터 다시 하기</button><button class="btn secondary" onclick="window.print()">결과 인쇄하기</button></div>`;}
function back(){stopMic();if(stage===1)move(0);else if(stage===6){if(mission===1)basicComplete();else move(5);}else if(stage===5){stage=4;index=discover.length;feedback='';render();}else if(stage===4)move(3);else if(stage>1)move(stage-1);}
function restart(){stopMic();answers=[[],[]];mission=0;mode='write';move(0);}
render();
</script></body></html>
